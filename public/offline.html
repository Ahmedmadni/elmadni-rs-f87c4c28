<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>غير متصل — مدني العقارية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: "Tajawal", "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, rgba(201,168,76,0.18), transparent 60%),
          linear-gradient(180deg, #0a0f1f 0%, #0F172A 100%);
        color: #f5efe1;
        display: grid; place-items: center; min-height: 100vh; padding: 24px;
      }
      .card {
        max-width: 520px; width: 100%; text-align: center;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(201,168,76,0.35);
        border-radius: 28px; padding: 40px 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        backdrop-filter: blur(10px);
      }
      .logo {
        width: 96px; height: 96px; margin: 0 auto 16px;
        border-radius: 50%; object-fit: cover;
        box-shadow: 0 0 30px rgba(201,168,76,0.45);
        border: 2px solid rgba(201,168,76,0.7);
      }
      h1 { font-size: 26px; margin: 8px 0 8px; color: #f3e6b8; font-weight: 800; }
      p  { font-size: 16px; color: #d6cdb6; line-height: 1.8; margin: 0 0 24px; }
      .btn {
        display: inline-block; padding: 14px 28px; border-radius: 999px;
        background: linear-gradient(135deg, #c9a84c, #f3d77a);
        color: #1a1408; font-weight: 800; text-decoration: none; border: 0; cursor: pointer;
        font-size: 15px; box-shadow: 0 10px 30px rgba(201,168,76,0.35);
      }
      .hint { margin-top: 18px; font-size: 13px; color: #9b9275; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icons/icon-192.png" alt="مدني العقارية" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>يرجى إعادة الاتصال لمتابعة تصفح العقارات.<br/>سنُحاول إعادة التحميل تلقائيًا عند عودة الاتصال.</p>
      <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
      <div class="hint">مدني العقارية — MADNI Real Estate</div>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
